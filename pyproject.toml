[project]
name = "seek-auth"
version = "0.1.0"
description = "SeekAuth — NetEase Noah's Ark verification server for Minecraft rental servers"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "SeekAuth" }]
keywords = ["minecraft", "netease", "noahs-ark", "auth", "fastapi"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "cryptography>=43.0",
    "orjson>=3.10",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
seek-auth = "seek_auth.__main__:main"
seek_auth = "seek_auth.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seek_auth"]
# The swagger-ui assets must ship inside the wheel, otherwise /docs can only
# fall back to the CDN. hatchling does not pick up .css/.js by default (it only
# tracks .py), so they have to be declared explicitly.
artifacts = ["src/seek_auth/static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# static/ holds third-party swagger-ui assets, not our code, so it is not linted.
extend-exclude = ["src/seek_auth/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",
    # Ambiguous-unicode rules: protocol data (player names, chat lines, upstream
    # messages) legitimately contains non-ASCII characters, so these would only
    # produce false positives.
    "RUF001",
    "RUF002",
    "RUF003",
    # Field names in models.py must match the NetEase wire format case-for-case,
    # so they cannot be renamed to snake_case.
    "N815",
    # BLE001 / S608 / S324 are disabled by default; noqa comments for them are noise.
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# pymarshal.py is a byte-for-byte port of the Go reference implementation and
# keeps Go-style type annotations and while loops.
"pymarshal.py" = ["UP006", "UP035", "UP045", "SIM108", "RUF022", "RUF023"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

# Note: test files are outside this configuration's scope. How to run:
#     uv run mypy src          # release gate, must be 0 errors
#     uv run mypy src tests    # also checks tests; there is pre-existing noise
#                              # (untyped pytest fixtures, missing reconfigure
#                              # stubs) that does not affect the release gate,
#                              # so it is not part of it.
